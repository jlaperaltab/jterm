[package]
name = "jterm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "jTerm en Rust: interfaz con iced y emulación con alacritty_terminal"

[[bin]]
name = "jterm"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26.0"
chrono = "0.4.45"
iced = { version = "0.14.0", features = ["canvas", "tokio", "advanced"] }
jterm-core = { path = "../jterm-core" }
jterm-net = { path = "../jterm-net" }
lucide-icons = "1.78.0"
muda = "0.21.2"
regex = "1.13.2"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
trash = "5.4.0"
uuid = "1.29.3"

[dev-dependencies]
tempfile = "3.27.0"
